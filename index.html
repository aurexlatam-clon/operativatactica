<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIKO · Operativa Táctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0a0806;
    --black-2: #131009;
    --gold: #cba869;
    --gold-bright: #e9c980;
    --cream: #f3ecdd;
    --cream-dim: rgba(243,236,221,0.72);
    --green: #4caf6e;
    --green-bright: #5fcf85;
    --line: rgba(203,168,105,0.22);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background: var(--black);
    color: var(--cream);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  img{ max-width:100%; display:block; }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- BARRA FIJA SUPERIOR ---------- */
  .topbar{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,8,6,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  .topbar-inner{
    max-width: 640px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-logo{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .topbar-btn{
    display: inline-block;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a08;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 20px;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }

  /* ---------- HERO (imagen completa, full-bleed) ---------- */
  .hero--full{
    position: relative;
    padding-top: 56px; /* espacio de la topbar fija */
    background: var(--black);
  }

  .hero-full-img{
    width: 100%;
    display: block;
  }

  .hero-cta-overlay{
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    display: inline-block;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a08;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    padding: 15px 40px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 16px 32px -8px rgba(0,0,0,0.6);
    white-space: nowrap;
  }

  /* ---------- HERO ---------- */
  .hero{
    position: relative;
    padding: 76px 0 40px;
    text-align: center;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, rgba(203,168,105,0.10), transparent 60%),
      var(--black);
  }

  .hero-eyebrow{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--gold-bright);
    margin-bottom: 18px;
  }

  .hero-image{
    max-width: 420px;
    margin: 0 auto 28px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .hero-image img{ width:100%; }

  .hero-stats{
    display:flex;
    justify-content:center;
    gap: 28px;
    margin-top: 30px;
    flex-wrap: wrap;
  }

  .stat{
    text-align:center;
  }

  .stat-num{
    font-size: 26px;
    font-weight: 700;
    color: var(--gold-bright);
    line-height: 1;
  }

  .stat-label{
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 6px;
    letter-spacing: 0.01em;
  }

  /* ---------- SECCIONES (placeholder para imágenes futuras) ---------- */
  .section{
    padding: 36px 0;
    border-top: 1px solid var(--line);
  }

  .section-full-img{
    width: 100%;
    display: block;
    margin-bottom: 36px;
  }

  .section-placeholder{
    border: 1px dashed rgba(203,168,105,0.35);
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    color: rgba(243,236,221,0.4);
    font-size: 14px;
    font-family: 'Fraunces', serif;
    font-style: italic;
  }

  /* ---------- TEXTOS INTRODUCTORIOS (bróker / premios) ---------- */
  .intro-block{
    text-align: center;
    max-width: 420px;
    margin: 0 auto 24px;
  }

  .intro-block--tight{
    margin-top: 40px;
  }

  .intro-rule{
    display: block;
    width: 36px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    margin: 0 auto 18px;
  }

  .intro-text{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.45;
    letter-spacing: 0.005em;
    color: var(--cream);
  }

  /* ---------- STATEMENT DE IMPACTO (30 años) ---------- */
  .impact-block{
    text-align: center;
    max-width: 380px;
    margin: 40px auto 24px;
  }

  .impact-statement{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .impact-lead{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--cream-dim);
    letter-spacing: 0.03em;
  }

  .impact-number{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 58px;
    line-height: 1;
    letter-spacing: -0.01em;
    background: linear-gradient(180deg, var(--gold-bright) 20%, var(--gold) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 2px 0 8px;
  }

  .impact-tail{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.4;
    color: var(--cream);
  }

  /* ---------- BOTÓN PREMIOS TELETRADE (provisional) ---------- */
  .premios-btn{
    display: block;
    width: 100%;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a08;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 20px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }

  .premios-panel{
    display: none;
    margin-top: 18px;
    border-radius: 14px;
    overflow: hidden;
  }

  .premios-panel.open{
    display: block;
  }

  .premios-panel img{
    width: 100%;
  }

  /* ---------- CTA FINAL ---------- */
  .cta-section{
    padding: 48px 0 64px;
    text-align: center;
  }

  .cta-btn{
    display: inline-block;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a08;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    padding: 16px 44px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 16px 32px -10px rgba(203,168,105,0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta-btn:active{
    transform: scale(0.97);
  }

  .cta-note{
    margin-top: 16px;
    font-size: 12px;
    color: var(--cream-dim);
  }

  @media (min-width: 600px){
    .hero{ padding: 92px 0 56px; }
    .stat-num{ font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <span class="topbar-logo">TIKO</span>
      <a href="#" class="topbar-btn">Empezar ahora</a>
    </div>
  </div>

  <section class="hero hero--full">
    <img class="hero-full-img" src="hero.png" alt="TIKO — Operativa Táctica, 14 meses de historial operativo">
    <a href="#" class="hero-cta-overlay">Empezar ahora</a>
  </section>

  <!-- ============================================= -->
  <!-- A partir de aquí van entrando las secciones    -->
  <!-- con las imágenes que sigas subiendo, en orden. -->
  <!-- ============================================= -->
  <section class="section">
    <img class="section-full-img" src="teletrade.png" alt="TeleTrade — 31 años de experiencia en Forex">
    <div class="wrap">

      <div class="intro-block">
        <span class="intro-rule"></span>
        <p class="intro-text">Un bróker regulado, con toda su información<br>pública y verificable.</p>
      </div>

      <a href="https://www.teletrade.org/es/for-clients/documents" target="_blank" rel="noopener" class="premios-btn" style="margin-bottom: 14px; text-decoration:none; text-align:center;">
        Documentación Legal
      </a>

      <div class="impact-block">
        <span class="intro-rule"></span>
        <p class="impact-statement">
          <span class="impact-lead">Más de</span>
          <span class="impact-number">30 años</span>
          <span class="impact-tail">en los mercados no pasan<br>sin dejar huella.</span>
        </p>
      </div>

      <button type="button" class="premios-btn" onclick="document.getElementById('premios-panel').classList.toggle('open'); this.classList.toggle('is-open');">
        Premios TeleTrade
      </button>
      <div id="premios-panel" class="premios-panel">
        <img src="premios.png" alt="Premios y reconocimientos TeleTrade">
      </div>
    </div>
  </section>

</body>
</html>
